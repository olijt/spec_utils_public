[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spec_utils"
version = "0.1.0"
description = "Shared utility functions for spectroscopic analyses"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Oliver Tye", email = "olijt@mit.edu" }]
dependencies = ["numpy", "numba", "matplotlib", "scipy", "tqdm", "pandas", "PyQt5", "pandas"]

[tool.setuptools]
packages = ["spec_utils"]